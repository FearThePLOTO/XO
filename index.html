<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XO · a duel under the blossoms</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="petals"></div>

    <main>
        <h1>XO</h1>
        <div class="players">
            <input id="x-name" placeholder="Player X" maxlength="12" autocomplete="off">
            <span>vs</span>
            <input id="o-name" placeholder="Player O" maxlength="12" autocomplete="off">
        </div>

        <div id="board" class="board">
            <svg class="grid" viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="none">
                <path d="M34 2C33 32 35 66 33.8 98M66.2 2C67.4 32 65.6 68 66.4 98M2 34C32 32.8 68 35.2 98 33.6M2 66.4C32 67.6 68 65.4 98 66.8M2 2.4C36 1.6 64 3.2 98 2.2C99.4 34 97.6 66 98.6 97.6C64 98.8 36 97.4 2.2 98C0.8 66 2.4 34 2 2.4Z"/>
            </svg>
        </div>
        <p id="status" role="status">Press start to duel</p>
        <button id="start">Start duel</button>
    </main>
</body>
</html>
